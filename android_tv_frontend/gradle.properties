# Project-wide Gradle settings
# Increase heap and add retry/timeouts for network stability in CI/Docker
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000
org.gradle.parallel=true
org.gradle.caching=true
# Retry failed dependency downloads
systemProp.gradle.internal.repository.max.retries=5
systemProp.gradle.internal.repository.initial.backoff=2000

# AndroidX only; Jetifier enabled for any transitive legacy artifacts
android.useAndroidX=true
android.enableJetifier=true

# Avoid AAPT crunching issues on PNGs (lets aapt2 handle images as-is)
android.disableResourceValidation=false

# Kotlin
kotlin.code.style=official
