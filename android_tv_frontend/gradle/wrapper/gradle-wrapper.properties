distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Pin Gradle 8.7-bin with checksum for reliability and security
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
distributionSha256Sum=69f0f3465eb56f450f4052322d2bd4c5ac99b93b588d7f0890b6e1b4dddf4ec0
# Increase network timeout for CI/Docker network hiccups (ms)
networkTimeout=60000
