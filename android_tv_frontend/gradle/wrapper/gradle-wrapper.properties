distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Pin Gradle 8.7-bin with checksum for reliability and security
distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
distributionSha256Sum=544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d
# Increase network timeout for CI/Docker network hiccups (ms)
networkTimeout=60000
# Enable Gradle's URL validation
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Provide a mirror fallback to reduce Docker download failures
distributionUrlFallback=https\://downloads.gradle-dn.com/distributions/gradle-8.7-bin.zip
